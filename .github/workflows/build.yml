name: build

# Builds the CrossPoint web reader and hosts it from THIS repo's GitHub Pages.
# The bundle is host-agnostic -- every URL it emits is relative and it falls
# back to coi-serviceworker.js when a host cannot set COOP/COEP -- so the same
# dist/ also drops onto Cloudflare Pages, Netlify, S3 or a local folder.
#
# Two paths, split on cost:
#   PRs            -> code-only build (~23 MB, no SD tree). Fast feedback.
#   main/dispatch  -> full build + deploy to Pages.
#
# dist/ is never committed. Pages is served straight from the build artifact,
# which is what keeps this repo ~6 MB despite a 157 MB output.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Only a full build (with the SD tree) is publishable.
    outputs:
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Load pins
        run: cat pins.env >> "$GITHUB_ENV"

      - name: Decide build mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      # Firmware and simulator are upstream repos we do not own, so they are
      # cloned at an exact SHA rather than vendored. --filter=blob:none keeps
      # the checkout to seconds without guessing a shallow depth.
      - name: Checkout firmware
        run: |
          git clone --filter=blob:none "$FIRMWARE_REPO" firmware
          git -C firmware checkout --detach "$FIRMWARE_REF"

      - name: Checkout simulator
        run: |
          git clone --filter=blob:none "$SIMULATOR_REPO" simulator
          git -C simulator checkout --detach "$SIMULATOR_REF"

      # Adds the cp_fb_* framebuffer exports the 3D view samples, and the
      # sleep/wake shim. Without it the build still links but 3D renders blank.
      - name: Apply simulator web patch
        run: git -C simulator apply --verbose ../patches/simulator-web.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      # Generated sources, not committed upstream. Skipping these fails the
      # compile with missing i18n symbols.
      - name: Firmware codegen
        working-directory: firmware
        run: |
          python scripts/gen_i18n.py --strip-unused
          python scripts/build_html.py

      # Incremental objects keyed on the toolchain + upstream pins. A cache hit
      # turns a ~15 min cold build into ~2 min; build.py uses -MMD depfiles plus
      # .cmd flag sidecars, so an object is rebuilt when its flags change.
      - name: Cache objects
        uses: actions/cache@v4
        with:
          path: obj
          key: obj-${{ env.EMSDK_VERSION }}-${{ env.FIRMWARE_REF }}-${{ env.SIMULATOR_REF }}-${{ hashFiles('build.py', 'patches/*.patch') }}
          restore-keys: obj-${{ env.EMSDK_VERSION }}-${{ env.FIRMWARE_REF }}-${{ env.SIMULATOR_REF }}-

      # Books, fonts and dictionaries. Kept out of git (large, binary, rarely
      # changes) and published as a release asset by scripts/pack-fs.ps1.
      - name: Fetch SD tree
        if: steps.mode.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$FS_CONTENT_TAG" --pattern 'fs-content.tar.zst' --output fs.tar.zst
          mkdir -p fs_
          tar --zstd -xf fs.tar.zst -C fs_
          echo "fs_ restored: $(du -sh fs_ | cut -f1)"

      - name: Build
        run: |
          source ./emsdk/emsdk_env.sh
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            python build.py all
          else
            for m in x4 x4pro x3; do python build.py model "$m" --skip-fs; done
            python build.py page --skip-fs
          fi

      - name: Check host limits
        run: |
          # Cloudflare Pages rejects any single asset over 25 MiB. GitHub Pages
          # has no per-asset cap but a 1 GB site limit; check both so the same
          # dist stays portable across hosts.
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then echo "::error::asset over 25 MiB:"; echo "$big"; exit 1; fi
          total=$(du -sm dist | cut -f1)
          echo "dist = ${total} MB, largest asset under 25 MiB"
          if [ "$total" -gt 1000 ]; then echo "::error::over the 1 GB Pages limit"; exit 1; fi
          test -f dist/.nojekyll || { echo "::error::missing .nojekyll"; exit 1; }

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 30

      - name: Upload Pages artifact
        if: steps.mode.outputs.full == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
